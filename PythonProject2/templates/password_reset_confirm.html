{% extends "base.html" %}

{% block title %}Смена пароля{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4 class="card-title mb-0">
                    <i class="fas fa-lock"></i> Смена пароля
                </h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ email_prefill or '' }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="code" class="form-label">Код</label>
                        <input type="text" class="form-control" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Новый пароль</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="password_confirm" class="form-label">Повторите пароль</label>
                        <input type="password" class="form-control" id="password_confirm" name="password_confirm" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-save"></i> Сменить пароль
                    </button>
                </form>
                <div class="text-center mt-3">
                    <p>Нет кода? <a href="{{ url_for('password_reset_request') }}">Запросить новый</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
