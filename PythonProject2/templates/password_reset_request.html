{% extends "base.html" %}

{% block title %}Сброс пароля{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4 class="card-title mb-0">
                    <i class="fas fa-unlock-alt"></i> Сброс пароля
                </h4>
            </div>
            <div class="card-body">
                <p class="text-muted">Одноразовый код будет выведен в консоль сервера.</p>
                <form method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ email_prefill or '' }}" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-key"></i> Получить код
                    </button>
                </form>
                <div class="text-center mt-3">
                    <p>Уже есть код? <a href="{{ url_for('password_reset_confirm', email=email_prefill) }}">Введите его</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
