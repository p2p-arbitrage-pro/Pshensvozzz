{% extends "base.html" %}

{% block title %}Подтверждение почты{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">Подтверждение почты</h5>
            </div>
            <div class="card-body">
                <p class="text-muted mb-4">
                    Введите код подтверждения, отправленный на {{ current_user.email }}.
                </p>
                <form method="post" action="{{ url_for('verify_email') }}">
                    <div class="mb-3">
                        <label class="form-label">Код</label>
                        <input type="text" name="code" class="form-control" maxlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Подтвердить</button>
                </form>
            </div>
            <div class="card-footer d-flex justify-content-between align-items-center">
                <span class="text-muted">Не пришёл код?</span>
                <form method="post" action="{{ url_for('resend_verification_email') }}">
                    <button type="submit" class="btn btn-outline-light btn-sm">Отправить снова</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
